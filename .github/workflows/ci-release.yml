name: toolchain-and-build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["packages/*/v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-and-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

jobs:
  verify:
    name: verify ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Assert native CPU and musl output triplet
        shell: bash
        run: |
          set -euo pipefail
          test "$(./repo.sh target)" = "${{ matrix.target }}"

      - name: Restore exact pinned toolchain
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .local/downloads
            .local/toolchain/${{ matrix.target }}
          key: polyglot-tools-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('tools.lock.toml', 'toolchain/**') }}

      - name: Restore exact Deno dependency graph
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .local/cache/deno
            node_modules
          key: polyglot-deno-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('tools.lock.toml', 'deno.lock') }}

      - name: Restore exact Moon task cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .moon/cache
            .local/cache/moon
            .local/cache/proto
            .local/cache/xdg
          key: polyglot-moon-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('tools.lock.toml', 'moon.yml', '.moon/**') }}

      - name: Restore exact Buck2 toolchain cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          # buck-out/v2/art holds the materialized (downloaded + extracted) toolchain
          # trees that back //toolchains/...; buck-out/v2/cache holds buck2's action
          # and materializer state db, which buck2 consults alongside the artifacts
          # to recognize them as up to date and skip re-downloading them. Both are
          # required together for a cache hit to also mean zero network transfer.
          # buck-out/v2/log, buck-out/v2/tmp, and buck-out/v2/forkserver are
          # per-invocation scratch state and are deliberately left uncached.
          path: |
            buck-out/v2/art
            buck-out/v2/cache
          key: polyglot-buck2-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('tools.lock.toml', 'toolchains/**', 'rules/**', 'platforms/**', '.buckconfig') }}

      - name: Bootstrap and validate pinned tools
        run: |
          ./repo.sh bootstrap
          ./repo.sh bootstrap --offline
          ./repo.sh doctor --deep

      - name: Buck2 toolchain smoke
        run: |
          ./repo.sh exec buck2 build //toolchains/...
          ./repo.sh exec buck2 build //toolchains/...
          # The second build above should be a full cache hit against the toolchain
          # tree restored or produced above. Assert it performed no network transfer
          # by reading buck2's own build summary rather than scraping console output,
          # which is more robust to console-format changes across buck2 releases.
          ./repo.sh exec buck2 log summary | grep -q 'Total downloaded: 0B'
          ./repo.sh exec buck2 kill

      - name: Run repository quality gates
        run: |
          ./repo.sh lint
          ./repo.sh package-validate
          ./repo.sh build
          ./repo.sh test

      - name: Build and run C++ profiles
        run: |
          ./repo.sh cpp-build dbg
          ./repo.sh cpp-run dbg
          ./repo.sh cpp-build opt
          ./repo.sh cpp-run opt

      - name: Exercise pinned Python runtime
        run: ./repo.sh python -I -c 'import ctypes, hashlib, sqlite3, ssl, sys, zlib; print(sys.version)'

      - name: Resolve tagged package
        if: startsWith(github.ref, 'refs/tags/packages/')
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package=${GITHUB_REF_NAME#packages/}
          package=${package%%/v*}
          printf 'name=%s\n' "$package" >> "$GITHUB_OUTPUT"

      - name: Assemble and verify tagged package
        if: startsWith(github.ref, 'refs/tags/packages/')
        shell: bash
        run: |
          set -euo pipefail
          package=${{ steps.package.outputs.name }}
          ./repo.sh package "$package" opt
          ./repo.sh release-check "$package" "$GITHUB_REF_NAME"
          archive=$(find dist -maxdepth 1 -type f -name "$package-*-${{ matrix.target }}.tar.gz" -print -quit)
          test -n "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload verified package asset
        if: startsWith(github.ref, 'refs/tags/packages/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/packages/')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download verified package assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: Publish package-specific GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ./repo.sh release-notes "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
