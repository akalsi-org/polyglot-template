name: toolchain-and-build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-and-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

jobs:
  verify:
    name: verify ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Assert native CPU and musl output triplet
        shell: bash
        run: |
          set -euo pipefail
          test "$(./repo.sh target)" = "${{ matrix.target }}"

      - name: Restore exact pinned toolchain
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .local/downloads
            .local/toolchain/${{ matrix.target }}
          key: polyglot-tools-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('tools.lock.toml', 'toolchain/**') }}

      - name: Bootstrap and validate pinned tools
        run: |
          ./repo.sh bootstrap
          ./repo.sh bootstrap --offline
          ./repo.sh doctor --deep

      - name: Run repository quality gates
        run: ./repo.sh ci

      - name: Build and run C++ profiles
        run: |
          ./repo.sh cpp-build dbg
          ./repo.sh cpp-run dbg
          ./repo.sh cpp-build opt
          ./repo.sh cpp-run opt

      - name: Exercise pinned Python runtime
        run: |
          ./repo.sh python -I -c 'import ctypes, hashlib, sqlite3, ssl, sys, zlib; print(sys.version)'
          ./repo.sh python-check

      - name: Check pinned Go lane
        run: ./repo.sh go-check

      - name: Check pinned TypeScript lanes
        run: |
          ./repo.sh ts-check
          ./repo.sh tsweb-check

  # Tag-triggered package publication is deliberately absent from this
  # executable slice. Enable the CI-RELEASE.md workflow only after every
  # toolchain digest is resolved and package/package-smoke/release commands
  # have clean-consumer tests. This keeps bootstrap CI green without
  # pretending unresolved release plumbing works.
