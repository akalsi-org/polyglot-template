# Reusable verification matrix: called by ci-release.yml (branch/PR pushes) and
# package-release.yml (packages/*/v* tags). Runs lint, test-dbg, and test-opt
# in parallel across native architecture runners with maximized caching.
name: verify

on:
  workflow_call:

env:
  CI: "1"

jobs:
  lint:
    name: lint ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Assert native CPU and musl output triplet
        shell: bash
        run: |
          set -euo pipefail
          test "$(./repo.sh target)" = "${{ matrix.target }}"

      - name: Restore toolchain & Buck2 cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .local/downloads
            .local/toolchain/${{ matrix.target }}
            .local/cache/deno
            node_modules
            buck-out/v2/art
            buck-out/v2/art-bxl
            buck-out/v2/cache
            buck-out/go-build-cache/${{ matrix.target }}
          key: polyglot-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('tools.lock.toml', 'toolchain/**', 'toolchains/**', '.buckconfig') }}
          restore-keys: |
            polyglot-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Bootstrap pinned tools
        run: |
          ./repo.sh bootstrap --offline || ./repo.sh bootstrap
          ./repo.sh doctor --deep

      - name: Buck2 toolchain smoke
        run: |
          set -euo pipefail
          ./repo.sh exec buck2 build //toolchains:native 2> buck2-second-build.log
          cat buck2-second-build.log
          if grep -q 'Down: [1-9]' buck2-second-build.log; then
            echo "error: expected a cache-hit build with 0B network downloaded, but a nonzero download was recorded" >&2
            exit 1
          fi
          rm -f buck2-second-build.log
          ./repo.sh exec buck2 kill

      - name: Offline full-graph replay (cold buck-out, no network)
        run: |
          set -euo pipefail
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -rn true || { echo "error: unprivileged user+net namespaces unavailable; cannot prove offline replay" >&2; exit 1; }
          ./repo.sh exec buck2 kill || true
          unshare -rn sh -c 'ip link set lo up 2>/dev/null || true; ./repo.sh exec buck2 clean && ./repo.sh build && ./repo.sh test'
          ./repo.sh exec buck2 kill

      - name: Run repository quality gates & infra tests
        run: |
          ./repo.sh lint
          ./repo.sh package-validate
          ./repo.sh infra-test
          ./test/graph-compdb-contract.sh
          ./test/deno-manifest-contract.sh

  test-dbg:
    name: test-dbg ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Assert native CPU and musl output triplet
        shell: bash
        run: |
          set -euo pipefail
          test "$(./repo.sh target)" = "${{ matrix.target }}"

      - name: Restore toolchain & Buck2 cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .local/downloads
            .local/toolchain/${{ matrix.target }}
            .local/cache/deno
            node_modules
            buck-out/v2/art
            buck-out/v2/art-bxl
            buck-out/v2/cache
            buck-out/go-build-cache/${{ matrix.target }}
          key: polyglot-v1-${{ runner.os }}-${{ matrix.target }}-dbg-${{ hashFiles('tools.lock.toml', 'toolchain/**', 'toolchains/**', '.buckconfig') }}
          restore-keys: |
            polyglot-v1-${{ runner.os }}-${{ matrix.target }}-dbg-
            polyglot-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Bootstrap pinned tools
        run: |
          ./repo.sh bootstrap --offline || ./repo.sh bootstrap

      - name: Run debug full-graph test suite
        run: ./repo.sh test dbg

      - name: Build and run C++ dbg profile
        run: |
          ./repo.sh cpp-build dbg
          ./repo.sh cpp-run dbg

      - name: Generate merged coverage report
        run: ./repo.sh coverage

      - name: Upload merged coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.target }}
          path: |
            buck-out/**/merged.lcov
            buck-out/**/summary.txt
          if-no-files-found: error
          compression-level: 0

  test-opt:
    name: test-opt ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Assert native CPU and musl output triplet
        shell: bash
        run: |
          set -euo pipefail
          test "$(./repo.sh target)" = "${{ matrix.target }}"

      - name: Restore toolchain & Buck2 cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .local/downloads
            .local/toolchain/${{ matrix.target }}
            .local/cache/deno
            node_modules
            buck-out/v2/art
            buck-out/v2/art-bxl
            buck-out/v2/cache
            buck-out/go-build-cache/${{ matrix.target }}
          key: polyglot-v1-${{ runner.os }}-${{ matrix.target }}-opt-${{ hashFiles('tools.lock.toml', 'toolchain/**', 'toolchains/**', '.buckconfig') }}
          restore-keys: |
            polyglot-v1-${{ runner.os }}-${{ matrix.target }}-opt-
            polyglot-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Bootstrap pinned tools
        run: |
          ./repo.sh bootstrap --offline || ./repo.sh bootstrap

      - name: Run optimized full-graph test suite
        run: ./repo.sh test opt

      - name: Build and run C++ opt profile
        run: |
          ./repo.sh cpp-build opt
          ./repo.sh cpp-run opt

      - name: Run the opt pyfast extension test
        run: ./repo.sh exec buck2 test --target-platforms //config:${{ matrix.target }}-opt //python/test:test

      - name: Exercise pinned Python runtime
        run: ./repo.sh python -I -c 'import ctypes, hashlib, sqlite3, ssl, sys, zlib; print(sys.version)'

      - name: Rehearse package release without publishing
        if: ${{ !startsWith(github.ref, 'refs/tags/packages/') }}
        shell: bash
        run: |
          set -euo pipefail
          package=polyglot-demo
          tag=packages/polyglot-demo/v0.1.0
          ./repo.sh package-target-check "$package"
          ./repo.sh package "$package" opt
          ./repo.sh release-check "$package" "$tag"

      - name: Enforce immutable release-tag policy
        if: startsWith(github.ref, 'refs/tags/packages/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git cat-file -p "$GITHUB_REF_NAME" | grep -Fq "tag $GITHUB_REF_NAME"

      - name: Resolve tagged package
        if: startsWith(github.ref, 'refs/tags/packages/')
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package=${GITHUB_REF_NAME#packages/}
          package=${package%%/v*}
          printf 'name=%s\n' "$package" >> "$GITHUB_OUTPUT"

      - name: Assemble and verify tagged package
        if: startsWith(github.ref, 'refs/tags/packages/')
        shell: bash
        run: |
          set -euo pipefail
          package=${{ steps.package.outputs.name }}
          ./repo.sh package-target-check "$package"
          ./repo.sh package "$package" opt
          ./repo.sh release-check "$package" "$GITHUB_REF_NAME"
          archive=$(find dist -maxdepth 1 -type f -name "$package-*-${{ matrix.target }}.tar.gz" -print -quit)
          test -n "$archive"
          sha256sum "$archive" > "$archive.sha256"
          test -s "$archive.sbom.json"
          test -s "$archive.provenance.json"

      - name: Upload verified package asset
        if: startsWith(github.ref, 'refs/tags/packages/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sbom.json
            dist/*.tar.gz.provenance.json
          if-no-files-found: error
          compression-level: 0

      - name: Attest verified package archive
        if: startsWith(github.ref, 'refs/tags/packages/')
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: dist/${{ steps.package.outputs.name }}-*-${{ matrix.target }}.tar.gz
