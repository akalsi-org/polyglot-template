# Reusable verification matrix: called by ci-release.yml (branch/PR pushes) and
# package-release.yml (packages/*/v* tags). Runs lint, test-dbg, and test-opt
# in parallel across native architecture runners with maximized caching.
name: verify

on:
  workflow_call:

# Called workflows inherit the caller's token scope, so without this block a
# tag push ran every matrix job with package-release.yml's write scopes. This
# is also the CEILING for every job below: a called workflow's job may
# request no more than its caller grants, and ci-release.yml (branch and PR
# runs) grants read only. Nothing here may ask for more - a single write
# scope anywhere below makes the whole file invalid on every branch push,
# which is why attestation lives in package-release.yml's release job
# instead. test/workflow-contract.sh enforces this.
permissions:
  contents: read

env:
  CI: "1"

jobs:
  lint:
    name: lint ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Assert native CPU and musl output triplet
        shell: bash
        run: |
          set -euo pipefail
          test "$(./repo.sh target)" = "${{ matrix.target }}"

      - name: Restore toolchain & Buck2 cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .local/downloads
            .local/toolchain/${{ matrix.target }}
            .local/cache/deno
            node_modules
            buck-out/v2/art
            buck-out/v2/art-bxl
            buck-out/v2/cache
            buck-out/go-build-cache/${{ matrix.target }}
          key: polyglot-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('tools.lock.toml', 'toolchain/**', 'toolchains/**', '.buckconfig') }}
          restore-keys: |
            polyglot-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Bootstrap pinned tools
        run: |
          ./repo.sh bootstrap --offline || ./repo.sh bootstrap
          ./repo.sh doctor --deep

      - name: Buck2 toolchain smoke
        run: |
          set -euo pipefail
          ./repo.sh exec buck2 build //toolchains:native 2> buck2-second-build.log
          cat buck2-second-build.log
          if grep -q 'Down: [1-9]' buck2-second-build.log; then
            echo "error: expected a cache-hit build with 0B network downloaded, but a nonzero download was recorded" >&2
            exit 1
          fi
          rm -f buck2-second-build.log
          ./repo.sh exec buck2 kill

      # BEFORE the offline replay, and the order is a measured cost, not a
      # preference. The replay's first act is `buck2 clean`, so anything after
      # it runs against a wiped buck-out and a cold daemon: this job used to
      # restore a buck-out cache, spend it on one toolchain build, delete it,
      # and then rebuild the whole graph a third time to lint it. Running the
      # gates first spends the restored cache on them instead. The replay
      # still starts from a clean tree, so it proves exactly what it did.
      #
      # ./repo.sh infra-test now runs graph-compdb-contract.sh and
      # deno-manifest-contract.sh itself, so local `./repo.sh ci` covers
      # exactly what this job covers. Do not re-list them here.
      - name: Run repository quality gates & infra tests
        run: |
          ./repo.sh lint
          ./repo.sh package-validate
          ./repo.sh infra-test

      - name: Offline full-graph replay (cold buck-out, no network)
        run: |
          set -euo pipefail
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -rn true || { echo "error: unprivileged user+net namespaces unavailable; cannot prove offline replay" >&2; exit 1; }
          ./repo.sh exec buck2 kill || true
          unshare -rn sh -c 'ip link set lo up 2>/dev/null || true; ./repo.sh exec buck2 clean && ./repo.sh build && ./repo.sh test'
          ./repo.sh exec buck2 kill

  test-dbg:
    name: test-dbg ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Assert native CPU and musl output triplet
        shell: bash
        run: |
          set -euo pipefail
          test "$(./repo.sh target)" = "${{ matrix.target }}"

      - name: Restore toolchain & Buck2 cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .local/downloads
            .local/toolchain/${{ matrix.target }}
            .local/cache/deno
            node_modules
            buck-out/v2/art
            buck-out/v2/art-bxl
            buck-out/v2/cache
            buck-out/go-build-cache/${{ matrix.target }}
          key: polyglot-v1-${{ runner.os }}-${{ matrix.target }}-dbg-${{ hashFiles('tools.lock.toml', 'toolchain/**', 'toolchains/**', '.buckconfig') }}
          restore-keys: |
            polyglot-v1-${{ runner.os }}-${{ matrix.target }}-dbg-
            polyglot-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Bootstrap pinned tools
        run: |
          ./repo.sh bootstrap --offline || ./repo.sh bootstrap
          ./repo.sh doctor --deep

      - name: Run debug full-graph test suite
        run: ./repo.sh test dbg

      - name: Build and run C++ dbg profile
        run: |
          ./repo.sh cpp-build dbg
          ./repo.sh cpp-run dbg

      # POLYGLOT_COVERAGE_MARKDOWN makes ./repo.sh coverage render the job
      # summary alongside the HTML report, from the same in-memory model, so
      # the summary can never disagree with the report it links to. It is
      # written even when the coverage floor fails - a failing run is exactly
      # when the missing lines are worth reading.
      - name: Generate merged coverage report from a cold Buck output tree
        id: coverage
        env:
          POLYGLOT_COVERAGE_MARKDOWN: coverage-summary.md
        run: ./repo.sh exec buck2 clean && ./repo.sh coverage

      # always() BUT ONLY once the coverage step actually ran: publishing on
      # every failure would make an earlier failure (say `test dbg`) report a
      # second, misleading red step for an artifact that was never produced.
      - name: Upload merged coverage report
        id: coverage-artifact
        if: always() && steps.coverage.conclusion != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.target }}
          path: |
            buck-out/**/merged.lcov
            buck-out/**/summary.txt
            buck-out/coverage-report/coverage.html
          if-no-files-found: error
          compression-level: 0

      # GitHub's job-summary renderer strips <script> and <style>, so the
      # interactive page cannot be inlined here; the summary carries the same
      # data as Markdown (per-directory rollup plus an expandable per-file
      # table with uncovered line ranges) and links to the artifact holding
      # the real page. if: always() so a run that fails the coverage floor
      # still publishes the numbers that explain the failure.
      - name: Publish coverage to the job summary
        if: always() && steps.coverage.conclusion != 'skipped'
        env:
          target: ${{ matrix.target }}
          artifact_url: ${{ steps.coverage-artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail
          if [ ! -f coverage-summary.md ]; then
            printf '## Coverage (%s)\n\nCoverage did not produce a report; see the job log.\n' \
              "$target" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            printf '### %s\n\n' "$target"
            if [ -n "$artifact_url" ]; then
              printf '[Download the browsable HTML report](%s) (in the `coverage-%s` artifact: one self-contained page with annotated sources).\n\n' \
                "$artifact_url" "$target"
            fi
            cat coverage-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

  test-opt:
    name: test-opt ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # No job-level permissions block, and that absence is load-bearing: see
    # the workflow header. This job assembles and uploads the tagged package
    # archives; package-release.yml's release job attests them after
    # verifying their checksums. See docs/CI-RELEASE.md.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Assert native CPU and musl output triplet
        shell: bash
        run: |
          set -euo pipefail
          test "$(./repo.sh target)" = "${{ matrix.target }}"

      - name: Restore toolchain & Buck2 cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .local/downloads
            .local/toolchain/${{ matrix.target }}
            .local/cache/deno
            node_modules
            buck-out/v2/art
            buck-out/v2/art-bxl
            buck-out/v2/cache
            buck-out/go-build-cache/${{ matrix.target }}
          key: polyglot-v1-${{ runner.os }}-${{ matrix.target }}-opt-${{ hashFiles('tools.lock.toml', 'toolchain/**', 'toolchains/**', '.buckconfig') }}
          restore-keys: |
            polyglot-v1-${{ runner.os }}-${{ matrix.target }}-opt-
            polyglot-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Bootstrap pinned tools
        run: |
          ./repo.sh bootstrap --offline || ./repo.sh bootstrap
          ./repo.sh doctor --deep

      - name: Run optimized full-graph test suite
        run: ./repo.sh test opt

      - name: Build and run C++ opt profile
        run: |
          ./repo.sh cpp-build opt
          ./repo.sh cpp-run opt

      - name: Run the opt pyfast extension test
        run: ./repo.sh exec buck2 test --target-platforms //config:${{ matrix.target }}-opt //python/test:test

      - name: Exercise pinned Python runtime
        run: ./repo.sh python -I -c 'import ctypes, hashlib, sqlite3, ssl, sys, zlib; print(sys.version)'

      - name: Rehearse package release without publishing
        if: ${{ !startsWith(github.ref, 'refs/tags/packages/') }}
        shell: bash
        run: |
          set -euo pipefail
          package=polyglot-demo
          tag=packages/polyglot-demo/v0.1.0
          ./repo.sh package-target-check "$package"
          ./repo.sh package "$package" opt
          ./repo.sh release-check "$package" "$tag"

      - name: Enforce immutable release-tag policy
        if: startsWith(github.ref, 'refs/tags/packages/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git cat-file -p "$GITHUB_REF_NAME" | grep -Fq "tag $GITHUB_REF_NAME"

      - name: Resolve tagged package
        if: startsWith(github.ref, 'refs/tags/packages/')
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package=${GITHUB_REF_NAME#packages/}
          package=${package%%/v*}
          printf 'name=%s\n' "$package" >> "$GITHUB_OUTPUT"

      - name: Assemble and verify tagged package
        if: startsWith(github.ref, 'refs/tags/packages/')
        shell: bash
        # The package name derives from $GITHUB_REF_NAME, and a git ref may
        # contain ';', '|', backticks or $(...). Expanding it directly into a
        # run: body would let a crafted tag execute commands in this job. Via
        # env: it is data the shell never re-parses.
        env:
          package: ${{ steps.package.outputs.name }}
          target: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ./repo.sh package-target-check "$package"
          ./repo.sh package "$package" opt
          ./repo.sh release-check "$package" "$GITHUB_REF_NAME"
          archive=$(find dist -maxdepth 1 -type f -name "$package-*-$target.tar.gz" -print -quit)
          test -n "$archive"
          # Record the BARE archive name, not "dist/<name>". upload-artifact
          # strips the dist/ prefix, so a dist/-prefixed body made the
          # publisher's `(cd artifacts && sha256sum --check ...)` fail with
          # "No such file or directory" and abort the release.
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          test -s "$archive.sbom.json"
          test -s "$archive.provenance.json"

      - name: Upload verified package asset
        if: startsWith(github.ref, 'refs/tags/packages/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sbom.json
            dist/*.tar.gz.provenance.json
          if-no-files-found: error
          compression-level: 0
