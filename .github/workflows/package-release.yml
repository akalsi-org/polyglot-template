# Package release: fires ONLY on packages/<name>/v<semver> tags, so
# branch/PR runs of ci-release.yml never show a skipped release job. Runs the same
# reusable verify matrix (which, on a tag ref, also assembles + smokes +
# uploads the package archives), then publishes the GitHub Release.
name: package-release

on:
  push:
    tags: ["packages/*/v*"]

permissions:
  contents: read
  attestations: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: package-release-${{ github.ref }}
  # A tag is immutable. Never cancel a partially published release in favor of
  # a rerun; the publication step below reconciles an existing release safely.
  cancel-in-progress: false

env:
  CI: "1"

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    if: startsWith(github.ref, 'refs/tags/packages/')
    needs: verify
    runs-on: ubuntu-24.04
    # A job-level block REPLACES the workflow-level one, so every permission
    # this job needs is listed here. It is the only job in the repository
    # that mints an attestation: verify.yml cannot, because a called
    # workflow's job may request no more than its caller grants, and
    # ci-release.yml grants contents: read on branch runs.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The publish step below calls `./repo.sh release-notes` and
      # `./repo.sh python`, both of which route through setup_environment and
      # hard-fail with "pinned toolchain is not installed" on a bare runner.
      # This job therefore bootstraps exactly like the verify.yml jobs do; the
      # cache key mirrors their structure so a warm verify run seeds it.
      - name: Restore toolchain & Buck2 cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .local/downloads
            .local/toolchain/x86_64-linux-musl
            .local/cache/deno
            node_modules
            buck-out/v2/art
            buck-out/v2/art-bxl
            buck-out/v2/cache
            buck-out/go-build-cache/x86_64-linux-musl
          key: polyglot-v1-${{ runner.os }}-x86_64-linux-musl-${{ hashFiles('tools.lock.toml', 'toolchain/**', 'toolchains/**', '.buckconfig') }}
          restore-keys: |
            polyglot-v1-${{ runner.os }}-x86_64-linux-musl-

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Bootstrap pinned tools
        run: |
          ./repo.sh bootstrap --offline || ./repo.sh bootstrap
          ./repo.sh doctor --deep

      - name: Download verified package assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: Publish package-specific GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ./repo.sh release-notes "$GITHUB_REF_NAME" > release-notes.md
          shopt -s nullglob
          assets=(artifacts/*.tar.gz)
          checksums=(artifacts/*.tar.gz.sha256)
          sboms=(artifacts/*.tar.gz.sbom.json)
          provenances=(artifacts/*.tar.gz.provenance.json)
          ((${#assets[@]} > 0 && ${#assets[@]} == ${#checksums[@]} && ${#assets[@]} == ${#sboms[@]} && ${#assets[@]} == ${#provenances[@]}))
          for checksum in "${checksums[@]}"; do
            (cd artifacts && sha256sum --check "$(basename "$checksum")")
          done
          ./repo.sh python -I tools/release_evidence.py release-manifest \
            --tag "$GITHUB_REF_NAME" --output artifacts/release-manifest.json "${assets[@]}"
          evidence=("${sboms[@]}" "${provenances[@]}" artifacts/release-manifest.json)
          release_assets=("${assets[@]}" "${checksums[@]}" "${evidence[@]}")
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A retry may add a missing asset, but it must never replace a
            # published byte stream. A differing asset means the supposedly
            # immutable release is inconsistent and fails closed.
            for asset in "${release_assets[@]}"; do
              name=$(basename "$asset")
              if gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir published --clobber >/dev/null 2>&1; then
                cmp -- "$asset" "published/$name"
              else
                gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      # AFTER publication, deliberately. The step above is what verifies each
      # archive against its checksum; attesting before it would bind the
      # workflow's identity to bytes nothing had checked yet. Publication is
      # idempotent and reconciling by design, so if this step fails the rerun
      # re-attests without republishing. One call covers every target: the
      # glob matches both architectures' archives.
      - name: Attest published package archives
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: artifacts/*.tar.gz
