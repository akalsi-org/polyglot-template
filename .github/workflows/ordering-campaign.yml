# Native ARM64 memory-ordering mutation campaign.
#
# This workflow stays manual because weak-memory failures are probabilistic and
# the campaign is much slower than the normal verification matrix. Native ARM64
# is required. An amd64 host or QEMU user mode cannot adjudicate these mutants.
name: ordering-campaign

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Repetitions per mutant (minimum 20)"
        required: false
        default: "100"

permissions:
  contents: read

jobs:
  arm64:
    name: Go ordering mutants (native ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Assert native ARM64 and validate repetitions
        shell: bash
        env:
          repetitions: ${{ inputs.repetitions }}
        run: |
          set -euo pipefail
          arch=$(uname -m)
          test "$arch" = aarch64 || {
            printf 'error: ordering campaign requires native aarch64, got %s\n' "$arch" >&2
            exit 1
          }
          test "$(./repo.sh target)" = aarch64-linux-musl
          [[ "$repetitions" =~ ^[0-9]+$ ]] && ((repetitions >= 20)) || {
            printf 'error: repetitions must be an integer of at least 20, got %s\n' "$repetitions" >&2
            exit 1
          }

      - name: Restore pinned repository cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .local/downloads
            .local/toolchain/aarch64-linux-musl
            .local/cache/deno
            node_modules
            buck-out/v2/art
            buck-out/v2/art-bxl
            buck-out/v2/cache
            buck-out/go-build-cache/aarch64-linux-musl
          key: polyglot-v1-${{ runner.os }}-aarch64-linux-musl-ordering-${{ hashFiles('tools.lock.toml', 'toolchain/**', 'toolchains/**', '.buckconfig') }}
          restore-keys: |
            polyglot-v1-${{ runner.os }}-aarch64-linux-musl-ordering-
            polyglot-v1-${{ runner.os }}-aarch64-linux-musl-

      - name: Bootstrap pinned tools and verify repository health
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a ordering-environment.log) 2>&1
          uname -a
          ./repo.sh bootstrap --offline || ./repo.sh bootstrap
          ./repo.sh doctor --deep
          ./repo.sh go version

      - name: Run strict ordering campaign
        id: campaign
        shell: bash
        env:
          ORDERING_MUTANTS_REPETITIONS: ${{ inputs.repetitions }}
          ORDERING_MUTANTS_REQUIRE_CAUGHT: "1"
        run: |
          set -euo pipefail
          ./repo.sh exec go/lib/mpsc/ordering_mutants.sh 2>&1 | tee ordering-mutants.log

      - name: Publish ordering verdicts to the job summary
        if: always() && steps.campaign.conclusion != 'skipped'
        shell: bash
        run: |
          {
            echo '## Go ordering mutation campaign (native ARM64)'
            echo
            echo '```text'
            if test -f ordering-mutants.log; then
              grep -E '^(PASS|CAUGHT|NOT-CAUGHT|INVALID|CONTROL)' ordering-mutants.log || cat ordering-mutants.log
            else
              echo 'The campaign did not produce a log. See the job log.'
            fi
            echo '```'
            echo
            echo 'Strict mode requires every valid mutant to be caught.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ordering campaign diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordering-campaign-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ordering-environment.log
            ordering-mutants.log
          if-no-files-found: warn
          retention-days: 30
