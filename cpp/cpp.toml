[toolchain]
cxx = "@PINNED_CXX@"
standard = "gnu++26"
reflection_flag = "-freflection"

[profiles.dbg]
compile_flags = [
  "-O0",
  "-g3",
  "-Wall",
  "-Wextra",
  "-Wpedantic",
  "-Werror=uninitialized",
  "-Werror=maybe-uninitialized",
  "-fno-omit-frame-pointer",
]
link_flags = ["-fuse-ld=mold"]

[profiles.opt]
compile_flags = [
  "-O3",
  "-DNDEBUG",
  "-Wall",
  "-Wextra",
  "-Wpedantic",
  "-Werror=uninitialized",
  "-Werror=maybe-uninitialized",
]
link_flags = ["-fuse-ld=mold"]
