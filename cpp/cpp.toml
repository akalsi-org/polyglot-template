[toolchain]
cxx = "@PINNED_CXX@"
standard = "gnu++26"
reflection_flag = "-freflection"

[profiles.dbg]
compile_flags = [
  "-O0",
  "-g3",
  "-Wall",
  "-Wextra",
  "-Wpedantic",
  "-Werror=uninitialized",
  "-Werror=maybe-uninitialized",
  "-fno-omit-frame-pointer",
]
link_flags = ["-fuse-ld=mold"]

[profiles.opt]
compile_flags = [
  "-O3",
  "-DNDEBUG",
  "-Wall",
  "-Wextra",
  "-Wpedantic",
  "-Werror=uninitialized",
  "-Werror=maybe-uninitialized",
]
link_flags = ["-fuse-ld=mold"]

[test_framework]
include_dir = "@PINNED_DOCTEST_INCLUDE@"
runner_source = "test/doctest_runner.cc"

[[targets]]
name = "hello"
type = "executable"
sources = ["app/hello/main.cc"]
include_dirs = ["lib"]
adapter_dependencies = ["example-vendor"]

[[adapters]]
name = "example-vendor"
fragment = "adapters/example-vendor.json"
include_in_compdb = true

[[tests]]
name = "example_test"
sources = ["test/example_test.cc"]
include_dirs = ["lib"]
adapter_dependencies = ["example-vendor"]

[[tests]]
name = "example_edge_test"
sources = ["test/example_edge_test.cc"]
include_dirs = ["lib"]
adapter_dependencies = ["example-vendor"]
