schema_version = 1

[[package]]
name = "polyglot-demo"
version = "0.1.0"
kind = "application"
executables = ["cpp-hello", "go-hello", "python-hello"]
supported_targets = ["x86_64-linux-musl", "aarch64-linux-musl"]
runtime = { name = "python", version = "^3.14", variant = "install_only_stripped" }

[[package]]
name = "gateway"
version = "1.4.0"
kind = "application"
executables = ["gateway", "gateway-admin"]
supported_targets = ["x86_64-linux-musl", "aarch64-linux-musl"]
runtime = { name = "python", version = "^3.14", variant = "install_only_stripped" }

[[package]]
name = "schema-cli"
version = "0.8.2"
kind = "application"
executables = ["schema-cli"]
supported_targets = ["x86_64-linux-musl", "aarch64-linux-musl"]

[[package]]
name = "polyglot-server"
version = "0.1.0"
kind = "application"
executables = ["server"]
supported_targets = ["x86_64-linux-musl", "aarch64-linux-musl"]
smoke_args = { server = ["--smoke"] }

[[package]]
name = "runtime-python"
version = "3.14.6"
kind = "runtime"
runtime_name = "python"
variant = "install_only_stripped"
loader_tool = "gcc-musl"
supported_targets = ["x86_64-linux-musl", "aarch64-linux-musl"]

