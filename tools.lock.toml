# buck2 --version reports a content hash, not semver; the "version" below is the
# release tag. content_hash pins the exact reported hash so bootstrap/doctor can
# fail loudly if the downloaded binary reports something else.
[[artifact]]
tool = "buck2"
target = "x86_64-linux-musl"
version = "2026-07-15"
url = "https://github.com/facebook/buck2/releases/download/2026-07-15/buck2-x86_64-unknown-linux-musl.zst"
sha256 = "4d31666ece6f66bedc0c0df53f1e966e93aee13491529bb301fc83e8607d0955"
archive = "buck2-x86_64-unknown-linux-musl.zst"
expected = "buck2"
content_hash = "769ca6220bec1a2a5b17241abb337312d13fed0f4bcf143b9524367b1f06b449"

[[artifact]]
tool = "buck2"
target = "aarch64-linux-musl"
version = "2026-07-15"
url = "https://github.com/facebook/buck2/releases/download/2026-07-15/buck2-aarch64-unknown-linux-musl.zst"
sha256 = "3176576bb21a5b0b59d1fd6bd7b1e4b1d3d9b264285e678bae4fa7891fba80bb"
archive = "buck2-aarch64-unknown-linux-musl.zst"
expected = "buck2"
# content_hash is buck2's own reported hash of the BINARY, so it is
# per-architecture - this value was observed on CI's aarch64 leg from a
# download verified against the sha256 above (the x86_64 value was
# obtained the same way; the original entry had wrongly copied it here).
content_hash = "cff84d5d0ee8ff700a2738cb5eaac87995568b0456785ee75148295c4659c50c"

# Upstream's target-specific musllinux wheels bundle the clang-format binary
# and its runtime libraries. The archive names and hashes are immutable PyPI
# release artifacts; bootstrap extracts the binary without depending on pip.
